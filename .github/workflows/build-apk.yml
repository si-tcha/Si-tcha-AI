name: Build Android APK

on:
  push:
    branches: [ main, master, elsonkjimmy ]
  pull_request:
    branches: [ main, master, elsonkjimmy ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies in frontend
        run: |
          cd frontend
          npm ci

      - name: Generate Native Android Folder (Expo Prebuild)
        run: |
          cd frontend
          npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SI-TCHA-AI-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
