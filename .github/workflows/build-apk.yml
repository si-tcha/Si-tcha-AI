name: Build Android APK

on:
  push:
    branches: [ main, master, elsonkjimmy ]
  pull_request:
    branches: [ main, master, elsonkjimmy ]
  workflow_dispatch:
    inputs:
      api_url:
        description: URL API à embarquer dans l'APK interne (publique ou IP LAN, chemin /api obligatoire)
        required: true
        type: string

jobs:
  build:
    name: Build Android Internal Test Debug APK
    if: ${{ github.event_name == 'workflow_dispatch' || vars.EXPO_PUBLIC_API_URL != '' }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Free Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Validate EXPO_PUBLIC_API_URL Configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Vérification de l'URL API pour APK de test interne..."
            node scripts/validate-local-test-api-url.mjs "$EXPO_PUBLIC_API_URL"
          else
            echo "Vérification stricte de la variable EXPO_PUBLIC_API_URL..."
            node scripts/validate-api-url.mjs "$EXPO_PUBLIC_API_URL"
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies in frontend
        run: |
          cd frontend
          npm ci

      - name: Generate Native Android Folder (Expo Prebuild)
        run: |
          cd frontend
          npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1 -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SI-TCHA-AI-Internal-Test-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
