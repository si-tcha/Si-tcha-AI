name: Frontend CI

on:
  push:
    branches: [ "main", "master", "elsonkjimmy", "elsonkjimmy-*" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main", "master", "elsonkjimmy", "elsonkjimmy-*" ]
    paths:
      - 'frontend/**'

jobs:
  frontend-checks:
    name: Frontend Quality & Builds
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Expo Doctor Check (SDK 56)
        run: npm run doctor

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Export Web Bundle
        run: npm run export:web

      - name: Bundle Android Hermes
        run: npm run export:android
